openapi: 3.0.3
info:
  title: Duck Wake Lab
  description: Contract for the Duck Wake Lab wake API (Kelvin and advanced modes).
  version: 0.1.0
paths:
  /api/wake:
    post:
      operationId: computeWake
      summary: Compute wake geometry
      description: >
        Computes Froude number and wake boundary coordinates for a duck body
        length and swimming speed. The Kelvin envelope half-angle is fixed at
        arcsin(1/3) in every mode. In "advanced" mode an additional, narrower
        apparent wake is returned using the simplified educational
        approximation min(theta_kelvin, atan(0.5 / Fr)); this is not a
        universally valid hydrodynamic law. All angles are half-angles in
        degrees; all coordinates are in meters.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WakeRequest"
      responses:
        "200":
          description: Wake geometry and physics metadata
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WakeResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
  /api/wave-field:
    post:
      operationId: computeWaveField
      summary: Compute illustrative wave-interference field
      description: >
        Returns a deterministic, gridded water-surface displacement field
        behind the duck for two wave families (transverse and divergent) and
        their sum (combined). This is an illustrative interference model, not
        a fluid simulation, not a physically derived Kelvin wake solution, and
        not a physically exact duck wake. Displacements are arbitrary,
        dimensionless units. Grid values are [ny][nx] (row = y index, column =
        x index); coordinates are in meters. The field depends only on duck
        length and swimming speed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WaveFieldRequest"
      responses:
        "200":
          description: Wave-field grid and model parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WaveFieldResponse"
        "422":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HTTPValidationError"
components:
  schemas:
    Point2D:
      type: object
      required:
        - x_m
        - y_m
      properties:
        x_m:
          type: number
          description: X coordinate in meters
        y_m:
          type: number
          description: Y coordinate in meters
      additionalProperties: false
    WakeRequest:
      type: object
      required:
        - duck_length_m
        - swimming_speed_m_s
      properties:
        duck_length_m:
          type: number
          description: Duck body length in meters
          minimum: 0
          exclusiveMinimum: true
        swimming_speed_m_s:
          type: number
          description: Swimming speed in meters per second
          minimum: 0
        physics_mode:
          type: string
          enum:
            - kelvin
            - advanced
          default: kelvin
          description: >
            Physics model. "kelvin" is the classical fixed envelope (default);
            "advanced" adds a simplified Froude-dependent apparent wake.
      additionalProperties: false
    WakeResponse:
      type: object
      required:
        - physics_mode
        - froude_number
        - kelvin_angle_deg
        - apparent_angle_deg
        - wake_length_m
        - port_boundary
        - starboard_boundary
        - apparent_port_boundary
        - apparent_starboard_boundary
      properties:
        physics_mode:
          type: string
          enum:
            - kelvin
            - advanced
          description: Physics mode that produced this response
        froude_number:
          type: number
          description: Froude number Fr = v / sqrt(g L)
        kelvin_angle_deg:
          type: number
          description: Kelvin envelope half-angle in degrees (arcsin(1/3)); fixed
        apparent_angle_deg:
          type: number
          description: >
            Apparent (dominant visible) wake half-angle in degrees. Equals
            kelvin_angle_deg in kelvin mode; never exceeds it.
        wake_length_m:
          type: number
          description: Sampled wake extent behind the duck in meters
        port_boundary:
          type: array
          description: Port-side Kelvin envelope arm (physics coordinates)
          items:
            $ref: "#/components/schemas/Point2D"
        starboard_boundary:
          type: array
          description: Starboard-side Kelvin envelope arm (physics coordinates)
          items:
            $ref: "#/components/schemas/Point2D"
        apparent_port_boundary:
          type: array
          description: Port-side apparent wake arm (equals the envelope in kelvin mode)
          items:
            $ref: "#/components/schemas/Point2D"
        apparent_starboard_boundary:
          type: array
          description: Starboard-side apparent wake arm (equals the envelope in kelvin mode)
          items:
            $ref: "#/components/schemas/Point2D"
      additionalProperties: false
    WaveFieldRequest:
      type: object
      required:
        - duck_length_m
        - swimming_speed_m_s
      properties:
        duck_length_m:
          type: number
          description: Duck body length in meters
          minimum: 0
          exclusiveMinimum: true
        swimming_speed_m_s:
          type: number
          description: Swimming speed in meters per second
          minimum: 0
      additionalProperties: false
    WaveFieldResponse:
      type: object
      required:
        - duck_length_m
        - swimming_speed_m_s
        - froude_number
        - kelvin_angle_deg
        - wake_length_m
        - transverse_wavelength_m
        - divergent_wavelength_m
        - nx
        - ny
        - x_m
        - y_m
        - transverse
        - divergent
        - combined
      properties:
        duck_length_m:
          type: number
        swimming_speed_m_s:
          type: number
        froude_number:
          type: number
        kelvin_angle_deg:
          type: number
          description: Kelvin envelope half-angle in degrees; fixed reference
        wake_length_m:
          type: number
        transverse_wavelength_m:
          type: number
          description: Illustrative transverse wavelength rule L * (1 + 2 Fr)
        divergent_wavelength_m:
          type: number
          description: Illustrative divergent wavelength (fraction of transverse)
        nx:
          type: integer
          minimum: 2
        ny:
          type: integer
          minimum: 3
        x_m:
          type: array
          description: Grid x coordinates (m), -wake_length to 0
          items:
            type: number
        y_m:
          type: array
          description: Grid y coordinates (m), symmetric about 0
          items:
            type: number
        transverse:
          type: array
          description: Transverse displacement, [ny][nx], arbitrary units
          items:
            type: array
            items:
              type: number
        divergent:
          type: array
          description: Divergent displacement, [ny][nx], arbitrary units
          items:
            type: array
            items:
              type: number
        combined:
          type: array
          description: Transverse plus divergent displacement, [ny][nx]
          items:
            type: array
            items:
              type: number
      additionalProperties: false
    ValidationError:
      type: object
      required:
        - loc
        - msg
        - type
      properties:
        loc:
          type: array
          items:
            anyOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string
    HTTPValidationError:
      type: object
      properties:
        detail:
          type: array
          items:
            $ref: "#/components/schemas/ValidationError"
